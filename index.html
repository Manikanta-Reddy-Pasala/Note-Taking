<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Folia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --desk: #d7e1ea;
      --page: #f6f8fa;
      --under: #e4f0e6;
      --ink: #17202b;
      --mute: #526272;
      --faint: #5c6c7b;
      --line: #c5d1db;
      --leaf: #0f5c45;
      --leaf-soft: #dceee4;
      --hover: #e8eef3;
      --under-done: #17202b;
      --under-next: #0f5c45;
      --shadow: 0 16px 40px rgba(23, 32, 43, 0.12);
      --sans: "Familjen Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      --serif: Newsreader, "Iowan Old Style", Palatino, Georgia, serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --desk: #0b1015;
        --page: #24303a;
        --under: #173028;
        --ink: #e7eef4;
        --mute: #a9b7c3;
        --faint: #8494a3;
        --line: #31404d;
        --leaf: #8ed4b8;
        --leaf-soft: #1a3328;
        --hover: #24303a;
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--sans);
      background: var(--desk);
      color: var(--ink);
      display: flex;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.45;
      overscroll-behavior: none;
    }
    button, input, textarea { font-family: inherit; color: inherit; }
    button { cursor: pointer; }
    ::selection { background: var(--leaf-soft); }
    :focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
    body.gesturing, body.gesturing * { user-select: none !important; cursor: grabbing; }

    .rail {
      width: 248px;
      min-width: 248px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .brand {
      padding: 22px 18px 8px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .mark {
      width: 28px; height: 28px;
      color: var(--leaf);
      display: grid; place-items: center;
    }
    .brand h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 26px;
      margin: 0;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .brand small {
      display: block;
      margin-top: 3px;
      color: var(--mute);
      font-size: 13px;
    }
    .today-btn, .text-btn, .ghost {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font-weight: 600;
      font-size: 14px;
    }
    .today-btn {
      margin: 14px 16px 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      text-align: left;
    }
    .today-btn:hover, .text-btn:hover, .ghost:hover { border-color: var(--leaf); color: var(--leaf); }
    .today-btn kbd, kbd {
      font-family: inherit;
      font-weight: 500;
      color: var(--faint);
      font-size: 12px;
    }
    .search {
      margin: 0 16px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--mute);
      border-bottom: 1px solid var(--line);
      padding: 4px 2px 6px;
    }
    .search input {
      border: 0; background: transparent; outline: none; width: 100%;
      font-size: 14px; padding: 0;
    }
    .search input:focus-visible { outline: none; }
    .search:focus-within { border-bottom-color: var(--leaf); }
    .tree-label {
      padding: 4px 16px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--mute);
      font-size: 14px;
    }
    .icon-btn {
      width: 26px; height: 26px;
      border: 0; background: transparent; color: var(--mute);
      border-radius: 6px;
      display: grid; place-items: center; padding: 0;
      font-size: 16px;
    }
    .icon-btn:hover { background: var(--hover); color: var(--ink); }
    .tree {
      flex: 1;
      overflow: auto;
      padding: 0 8px 16px;
      min-height: 0;
    }
    .node, .leaf {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      color: var(--ink);
      user-select: none;
    }
    .node { cursor: pointer; }
    .leaf { cursor: grab; }
    .node:hover, .leaf:hover { background: var(--hover); }
    .node.active, .leaf.active { background: var(--leaf-soft); }
    .node.drop { background: var(--leaf-soft); outline: 1px solid var(--leaf); }
    .chev {
      width: 16px; height: 16px;
      border: 0; background: transparent; color: var(--faint);
      display: grid; place-items: center; padding: 0; flex: none;
    }
    .chev svg { transition: transform 0.15s ease; }
    .chev.open svg { transform: rotate(90deg); }
    .chev.empty { visibility: hidden; }
    .fname {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .count { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 13px; }
    .leaf-mark {
      width: 8px; height: 1px; background: var(--faint); flex: none; margin-left: 4px;
    }
    .leaf.active .leaf-mark { background: var(--leaf); }
    .side-foot {
      padding: 12px 16px 16px;
      color: var(--mute);
      font-size: 13px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      justify-content: space-between;
    }
    .hint { color: var(--mute); margin-top: 4px; line-height: 1.35; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 22px 12px;
      min-height: 58px;
    }
    .path { color: var(--mute); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .path b { color: var(--ink); font-weight: 600; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .text-btn { padding: 6px 10px; }
    .views { display: flex; gap: 4px; }
    .view {
      background: none; border: 0;
      color: var(--mute);
      font-weight: 600;
      font-size: 14px;
      padding: 6px 8px;
      border-radius: 6px;
    }
    .view.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--leaf); }
    .spread {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      padding: 0 18px 18px 10px;
      gap: 0;
    }
    .book {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      z-index: 1;
    }
    .sheet {
      position: relative;
      flex: 1;
      min-width: 0;
      background: var(--page);
      border-radius: 2px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .edge {
      position: absolute;
      top: 0; bottom: 0;
      width: 36px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: ew-resize;
      color: var(--faint);
    }
    .edge span {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 12px;
      max-height: 46%;
      overflow: hidden;
      pointer-events: none;
    }
    .edge-prev { left: 0; }
    .edge-next { right: 0; }
    .sheet-inner { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
    .prose { max-width: 68ch; padding: 8px 40px 48px; }
    .sheet-head {
      position: sticky; top: 0; z-index: 2;
      background: var(--page);
      padding-top: 8px;
    }
    .ed-bar { display: flex; align-items: center; gap: 8px; min-height: 32px; }
    .spacer { flex: 1; }
    .ed-title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(26px, 4vw, 34px);
      line-height: 1.15;
      letter-spacing: -0.03em;
      width: 100%;
      border: 0;
      background: transparent;
      padding: 4px 0 8px;
      outline: none;
      display: block;
      resize: none;
      overflow: hidden;
      field-sizing: content;
      min-height: 1.2em;
    }
    .ed-title:focus-visible { outline: none; box-shadow: inset 0 -1px 0 var(--leaf); }
    .ed-body {
      width: 100%;
      min-height: 50vh;
      border: 0;
      resize: none;
      background: transparent;
      outline: none;
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.55;
      padding: 0;
      tab-size: 2;
    }
    .ed-bar .hint { margin: 0; }
    .preview { font-family: var(--serif); font-size: 18px; line-height: 1.55; }
    .preview h1, .preview h2, .preview h3 { font-weight: 500; letter-spacing: -0.02em; line-height: 1.25; }
    .preview h1 { font-size: 28px; margin: 0.6em 0 0.3em; }
    .preview h2 { font-size: 22px; margin: 1em 0 0.3em; }
    .preview h3 { font-size: 18px; margin: 0.8em 0 0.25em; }
    .preview p { margin: 0.35em 0; }
    .preview .bullet { padding-left: 1em; text-indent: -0.8em; }
    .preview code {
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 0.86em;
      background: var(--desk);
      padding: 0 0.25em;
      border-radius: 3px;
    }
    .wikilink { color: var(--leaf); text-underline-offset: 3px; }
    .wikilink.missing { color: var(--mute); text-decoration-style: dotted; }
    .mentions { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line); }
    .mentions h2 { font-size: 18px; font-weight: 500; margin: 0 0 8px; }
    .mentions a { display: block; margin: 4px 0; }

    .pane { max-width: 40rem; padding: 8px 36px 48px; }
    .add-row { display: flex; gap: 8px; margin: 8px 0 14px; }
    .add-row input, .peek-add input, .modal input, .pal-input {
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 8px 2px;
      outline: none;
      font-size: 15px;
    }
    .add-row input { flex: 1; }
    .add-row input:focus, .peek-add input:focus, .modal input:focus, .pal-input:focus { border-bottom-color: var(--leaf); }
    .group-label {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 500;
      margin: 8px 0 6px;
    }
    .swipe { position: relative; overflow: hidden; border-radius: 6px; touch-action: pan-y; }
    .under {
      position: absolute; inset: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 14px;
      color: #f6f8fa;
      font-weight: 600;
      background: linear-gradient(90deg, var(--under-next) 0 50%, var(--under-done) 50% 100%);
    }
    .row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      background: var(--page);
      min-height: 36px;
    }
    .swipe:hover .row { background: var(--hover); }
    .row.dragging { transition: none; }
    .t-title, .line { min-width: 0; }
    .t-title { flex: 0 1 auto; }
    .line { flex: 1; }
    .task-tools { margin-left: auto; }
    .t-title.done, .line.done { color: var(--faint); text-decoration: line-through; }
    .when { color: var(--leaf); font-size: 13px; flex: none; }
    .task-tools { display: flex; gap: 2px; opacity: 0; }
    .swipe:hover .task-tools, .swipe:focus-within .task-tools { opacity: 1; }
    .check {
      appearance: none;
      width: 16px; height: 16px;
      border: 1.5px solid var(--mute);
      border-radius: 4px;
      background: transparent;
      flex: none;
      display: grid; place-items: center;
      margin: 0;
    }
    .check:checked { background: var(--leaf); border-color: var(--leaf); }
    .check:checked::after {
      content: "";
      width: 8px; height: 5px;
      border-left: 2px solid var(--page);
      border-bottom: 2px solid var(--page);
      transform: rotate(-45deg) translate(0, -1px);
    }
    .empty { color: var(--mute); padding: 28px 4px; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
      padding: 12px 8px 32px;
    }
    .col-h { display: flex; align-items: baseline; gap: 8px; }
    .col-h h3 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 22px;
      margin: 0;
    }
    .col-h span { color: var(--faint); font-variant-numeric: tabular-nums; }
    .card {
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      border-radius: 0;
      padding: 10px 2px;
      cursor: grab;
      box-shadow: none;
    }
    .card h4 { margin: 0; font-size: 15px; font-weight: 600; }
    .card h4.done { color: var(--faint); text-decoration: line-through; }
    .card.drag { opacity: 0.4; }
    .subs { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    .sub { display: flex; gap: 8px; align-items: center; color: var(--mute); font-size: 13px; }

    .peek {
      width: 54px;
      margin-left: -8px;
      padding-left: 8px;
      background: var(--under);
      border-radius: 0 2px 2px 0;
      display: flex;
      flex: none;
      min-height: 0;
      overflow: hidden;
      z-index: 0;
    }
    .peek.open { width: 300px; }
    .peek-tab {
      width: 46px;
      flex: none;
      border: 0;
      background: transparent;
      color: var(--leaf);
      font-family: var(--serif);
      font-size: 17px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      padding: 16px 0;
    }
    .peek-body { flex: 1; min-width: 0; overflow: auto; padding: 18px 16px 16px 6px; }
    .peek-body h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 26px;
      margin: 0 0 4px;
    }
    .peek-date { color: var(--mute); margin-bottom: 12px; }
    .peek-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-top: 1px solid var(--line);
      padding: 8px 0;
      display: block;
    }
    .peek-item small { display: block; color: var(--mute); font-size: 12px; }
    .peek-add { margin-top: 12px; }
    .peek-add input { width: 100%; }

    .slip {
      position: fixed;
      z-index: 50;
      width: min(320px, calc(100vw - 24px));
      background: var(--page);
      color: var(--ink);
      border-radius: 2px;
      box-shadow: var(--shadow);
      padding: 12px 14px 14px;
      pointer-events: none;
    }
    .slip[hidden] { display: none; }
    .slip strong {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 500;
      display: block;
    }
    .slip-where { color: var(--mute); font-size: 13px; margin: 2px 0 6px; }
    .slip p {
      margin: 0;
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: var(--page);
      border-radius: 999px;
      padding: 8px 8px 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 60;
      font-size: 14px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast button {
      background: transparent;
      color: inherit;
      border: 1px solid currentColor;
      border-radius: 999px;
      padding: 4px 10px;
      font-weight: 600;
    }

    .modal-bg, .palette-bg {
      position: fixed; inset: 0;
      background: rgba(16, 22, 28, 0.28);
      display: none;
      z-index: 40;
    }
    .modal-bg.on { display: grid; place-items: center; }
    .palette-bg.on { display: block; }
    .modal, .palette {
      background: var(--page);
      border-radius: 2px;
      box-shadow: var(--shadow);
      width: min(440px, calc(100vw - 32px));
    }
    .modal { padding: 18px; }
    .modal h3 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0 0 10px; }
    .modal input { width: 100%; margin-bottom: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .palette { margin: 14vh auto 0; overflow: hidden; }
    .pal-input { width: 100%; padding: 14px 16px; font-size: 16px; }
    .pal-list { max-height: 46vh; overflow: auto; padding-bottom: 8px; }
    .pal-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
    }
    .pal-item.on, .pal-item:hover { background: var(--leaf-soft); }
    .pal-item small { color: var(--mute); }
    .pal-foot { color: var(--faint); font-size: 13px; padding: 8px 16px 12px; }

    @media (max-width: 980px) {
      .rail { width: 208px; min-width: 208px; }
      .prose { padding: 8px 28px 40px; }
      .topbar { flex-wrap: wrap; row-gap: 8px; }
      .board { grid-template-columns: 1fr; gap: 8px 0; }
    }
    @media (max-width: 680px) {
      body { flex-direction: column; overflow: auto; }
      .rail { width: 100%; min-width: 0; max-height: 42vh; border-bottom: 1px solid var(--line); }
      .main { overflow: visible; }
      .spread { flex-direction: column; padding: 0 10px 16px; }
      .book { min-height: 60vh; }
      .peek { width: auto; margin: 8px 0 0; padding: 0; border-radius: 2px; flex-direction: column; }
      .peek.open { width: auto; }
      .peek-tab { writing-mode: horizontal-tb; transform: none; width: 100%; text-align: left; padding: 12px 14px; }
      .board { grid-template-columns: 1fr; }
      .ed-title { font-size: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <aside class="rail">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M5 16c5-1 9-6 11-12-5 1.2-8.2 4.6-11 12Z" stroke="currentColor" stroke-width="1.4"/>
          <path d="M6.2 15.2c2.2-3.4 4.4-5.6 8-7.4" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </div>
      <div>
        <h1>Folia</h1>
        <small>Leaves of a notebook</small>
      </div>
    </div>
    <button class="today-btn" id="btnOpen" type="button">Open folder</button>
    <input id="folderInput" type="file" accept=".md,text/markdown" webkitdirectory directory multiple hidden>
    <button class="today-btn" id="btnToday" type="button" title="Open today and carry unfinished tasks forward">
      Open today
      <kbd>N</kbd>
    </button>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <circle cx="6" cy="6" r="4.2" stroke="currentColor" stroke-width="1.3"/>
        <path d="M9.2 9.2 12 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <input id="search" type="search" placeholder="Search" autocomplete="off" />
    </label>
    <div class="tree-label">
      Vault
      <button class="icon-btn" id="btnAddFolder" type="button" aria-label="New folder">+</button>
    </div>
    <nav class="tree" id="tree" aria-label="Vault"></nav>
    <div class="side-foot">
      <div>
        <div id="footMeta">No folder open</div>
        <div class="hint">Swipe a task right for tomorrow. Drag the page edge to turn.</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="path" id="crumb"></div>
      <div class="top-actions">
        <button class="text-btn" id="btnJump" type="button">Jump <kbd id="jumpKbd">⌘K</kbd></button>
        <button class="text-btn" id="btnAddNote" type="button">New note</button>
        <nav class="views" role="tablist" aria-label="Views">
          <button class="view" type="button" data-view="notes" role="tab">Notes</button>
          <button class="view" type="button" data-view="tasks" role="tab">Tasks</button>
          <button class="view" type="button" data-view="board" role="tab">Board</button>
        </nav>
      </div>
    </header>
    <div class="spread" id="spread">
      <div class="book" id="book"></div>
      <aside class="peek" id="peek"></aside>
    </div>
  </main>

  <div class="slip" id="slip" role="tooltip" hidden>
    <strong id="slipTitle"></strong>
    <div class="slip-where" id="slipWhere"></div>
    <p id="slipText"></p>
  </div>
  <div class="toast" id="toast" role="status">
    <span id="toastMsg"></span>
    <button type="button" id="toastUndo" hidden>Undo</button>
  </div>
  <div class="modal-bg" id="modalBg">
    <form class="modal" id="modal">
      <h3 id="modalTitle">New folder</h3>

<script>

const TZ = "Asia/Dubai";

const $ = (id) => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10);

function todayISO(d = new Date()) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"
  }).format(d);
}
function addDays(iso, n) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + n, 12));

}
function dateAtNoon(iso) {

}
function formatHuman(iso) {
  return dateAtNoon(iso).toLocaleDateString("en-GB", {
    weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC"
  });
}
function shortDate(iso) {
  return dateAtNoon(iso).toLocaleDateString("en-GB", {
    day: "numeric", month: "short", timeZone: "UTC"
  });
}
function noteLabel(note) {
  if (!note.date) return note.title;
  return dateAtNoon(note.date).toLocaleDateString("en-GB", {
    weekday: "short", day: "numeric", month: "short", timeZone: "UTC"
  });
}

function emptyVault() {
  return {
    folders: [], notes: [], tasks: [],
    selectedFolderId: null, selectedNoteId: null,
    view: "notes", collapsed: {}, query: "", peekOpen: false,
    folderName: ""

}
const fileHandles = new Map();
const dirHandles = new Map();
const written = new Map();
let rootHandle = null;

function headingOrName(body, base) {
  const heading = String(body || "").match(/^#\s+(.+)$/m);
  return heading ? heading[1].trim() : base;
}
function tasksFromNote(note) {
  const stack = [];
  return parseChecks(note.body).map(check => {
    const depth = check.depth || 0;
    while (stack.length && stack[stack.length - 1].depth >= depth) stack.pop();
    const parent = stack[stack.length - 1];
    const task = t(
      uid(), note.folderId, check.title.trim(), check.done,
      check.done ? "done" : "todo", parent ? parent.id : null, note.id, note.date
    );
    task.line = check.line;
    stack.push({ depth, id: task.id });
    return task;
  });
}
function noteFromFile(folderId, name, body) {
  const base = name.replace(/\.md$/i, "");
  const date = /^\d{4}-\d{2}-\d{2}$/.test(base) ? base : null;
  return {
    id: uid(), folderId, type: date ? "daily" : "note", date,
    title: date ? formatHuman(date) : headingOrName(body, base),
    body, fileName: name
  };
}
function pruneEmpty(folders, notes) {
  const keep = new Set();
  notes.forEach(note => {
    let id = note.folderId;
    const guard = new Set();
    while (id && !guard.has(id)) {
      guard.add(id);
      keep.add(id);
      const folder = folders.find(item => item.id === id);
      id = folder ? folder.parentId : null;
    }
  });

}
function focusDaily(folders, notes) {
  const ranked = folders.map(folder => ({
    folder,
    count: notes.filter(note => note.folderId === folder.id && note.date).length
  })).sort((a, b) => b.count - a.count);
  const folder = (ranked[0] && ranked[0].count ? ranked[0].folder : folders[0]) || null;
  const collapsed = {};
  folders.forEach(item => { collapsed[item.id] = true; });
  if (!folder) return { selectedFolderId: null, selectedNoteId: null, collapsed };
  let id = folder.id;
  const guard = new Set();
  while (id && !guard.has(id)) {
    guard.add(id);
    collapsed[id] = false;
    const current = folders.find(item => item.id === id);
    id = current ? current.parentId : null;
  }
  const inFolder = notes.filter(note => note.folderId === folder.id);
  const today = inFolder.find(note => note.date === todayISO());
  const latest = inFolder.filter(note => note.date).sort((a, b) => a.date.localeCompare(b.date)).pop();

function adoptVault(name, folders, notes) {

  const tasks = notes.flatMap(tasksFromNote);
  const focus = focusDaily(folders, notes);
  const next = emptyVault();
  next.folderName = name || "";
  next.folders = folders;
  next.notes = notes;
  next.tasks = tasks;
  next.selectedFolderId = focus.selectedFolderId;
  next.selectedNoteId = focus.selectedNoteId;
  next.collapsed = focus.collapsed;
  next.query = state && state.query || "";
  next.view = "notes";
  state = next;

}
function buildFromList(entries) {
  fileHandles.clear();
  dirHandles.clear();
  written.clear();
  rootHandle = null;
  const folders = [];
  const notes = [];
  const folderIds = new Map();
  entries.forEach(entry => {
    const parts = String(entry.path || "").split("/").filter(Boolean);
    const file = parts.pop();
    if (!file || !/\.md$/i.test(file)) return;
    let parent = null;
    let key = "";
    parts.forEach(part => {
      key = key ? `${key}/${part}` : part;
      if (!folderIds.has(key)) {
        const id = uid();
        folderIds.set(key, id);
        folders.push({ id, name: part, parentId: parent });
      }
      parent = folderIds.get(key);
    });
    const note = noteFromFile(parent, file, entry.body || "");
    notes.push(note);
    if (entry.handle) fileHandles.set(note.id, entry.handle);
  });

const writeChain = new Map();
async function persistNote(note) {
  const handle = fileHandles.get(note.id);
  if (!handle) return;
  const body = note.body;
  if (written.get(note.id) === body) return;
  written.set(note.id, body);
  try {
    const writable = await handle.createWritable();
    await writable.write(body);
    await writable.close();
  } catch (err) {
    written.delete(note.id);
    toast("Could not save the file");
    return;
  }
  if (note.body !== body) {
    written.delete(note.id);
    await persistNote(note);
  }
}
function writeNote(note) {
  if (!note || !fileHandles.get(note.id)) return;
  const run = (writeChain.get(note.id) || Promise.resolve()).then(() => persistNote(note));
  writeChain.set(note.id, run.catch(() => {}));
}
async function walkDir(dir, parentId, folders, notes) {
  for await (const [name, handle] of dir.entries()) {
    if (name.startsWith(".")) continue;
    if (handle.kind === "directory") {
      const id = uid();
      folders.push({ id, name, parentId });
      dirHandles.set(id, handle);
      await walkDir(handle, id, folders, notes);
    } else if (handle.kind === "file" && /\.md$/i.test(name)) {
      const body = await (await handle.getFile()).text();
      const note = noteFromFile(parentId, name, body);
      notes.push(note);
      fileHandles.set(note.id, handle);
    }
  }
}
async function openRoot(handle) {
  fileHandles.clear();
  dirHandles.clear();
  written.clear();
  rootHandle = handle;
  const folders = [];
  const notes = [];
  const rootId = uid();
  folders.push({ id: rootId, name: handle.name, parentId: null });
  dirHandles.set(rootId, handle);
  await walkDir(handle, rootId, folders, notes);
  adoptVault(handle.name, folders, notes);

}
function dirDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("folia-folder", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("handles");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

  try {
    const db = await dirDb();
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(handle, "root");
  } catch (err) { /* the folder can still be opened again */ }
}
async function storedHandle() {
  try {
    const db = await dirDb();
    return await new Promise(resolve => {
      const tx = db.transaction("handles", "readonly");
      const req = tx.objectStore("handles").get("root");
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (err) {
    return null;
  }
}
async function openFolder() {
  if (!window.showDirectoryPicker) {
    $("folderInput").click();
    return;
  }
  try {
    const saved = await storedHandle();
    if (saved) {
      const perm = await saved.requestPermission({ mode: "readwrite" });
      if (perm === "granted") {
        await openRoot(saved);
        return;

}
async function readDroppedFiles(fileList) {
  const entries = [];
  for (const item of fileList) {
    const path = item.webkitRelativePath || item.name;
    const base = path.split("/").pop();
    if (!base || base.startsWith(".") || !/\.md$/i.test(base) || path.split("/").some(part => part.startsWith("."))) continue;
    entries.push({ path, body: await item.text() });
  }

}
function seed() {
  return emptyVault();
}


function t(id, folderId, title, done, status, parentId, dailyNoteId, dailyDate, scheduledFor) {
  return {
    id, folderId, title, done, status,
    parentId: parentId || null,
    dailyNoteId: dailyNoteId || null,

    rolledFromDate: null,

  };
}

function normalize(s) {
  if (!s || !Array.isArray(s.folders) || !Array.isArray(s.notes) || !Array.isArray(s.tasks)) return seed();
  s.tasks.forEach(task => { if (!("scheduledFor" in task)) task.scheduledFor = null; });

}

let state = load();

let editingNote = false;
let toastTimer = 0;
let undoFn = null;
let gesture = null;
let suppressClick = false;
let turnToken = 0;
let slipTimer = 0;
let paletteIndex = 0;
let paletteItems = [];

function flushEditor() {

}

  const body = $("noteBody");

}

function folderById(id) { return state.folders.find(f => f.id === id); }

    path.unshift(cur);
    cur = cur.parentId ? folderById(cur.parentId) : null;
  }

}

  const out = [id];
  for (const c of childrenOf(id)) out.push(...descendantIds(c.id));

}

}
function orderedNotes(folderId) {
  return state.notes.filter(n => n.folderId === folderId).sort((a, b) => {

}
function findNote(title) {

}

}

    .replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]+)?\]\]/g, "$1")
    .replace(/^#{1,6}\s+/gm, "")

  return addDays(todayISO(), 1);
}
function peekLabel() {
  const date = peekDate();

}
function tomorrowTasks() {
  const date = peekDate();

}
function tasksIn(folderId) {

  const folder = folderById(folderId);
  if (folder && folder.name === "Daily" && !folder.parentId) {
    const focus = state.notes.find(n => n.id === state.selectedNoteId && n.type === "daily" && n.folderId === folderId)
      || state.notes.find(n => n.type === "daily" && n.date === todayISO());

}

  return state.notes.some(n => ids.includes(n.folderId) && (n.title + " " + n.body).toLowerCase().includes(q))

function esc(s) {

}

}

  while ((match = re.exec(raw))) {
    out += emphasis(raw.slice(last, match.index));
    const target = match[1].trim();
    const label = (match[2] || match[1]).trim();
    const note = findNote(target);
    out += `<a class="wikilink${note ? "" : " missing"}" href="#" data-target="${escAttr(target)}">${emphasis(label)}</a>`;

function taskTree(list) {
  const byParent = new Map();
  list.forEach(task => {
    const key = task.parentId || "_";
    if (!byParent.has(key)) byParent.set(key, []);
    byParent.get(key).push(task);

    rolledFrom: null, rolledFromDate: null,
    scheduledFor: date
  };
  state.tasks.push(task);
  if (owner) placeCheck(owner, title, date);
  state.peekOpen = true;
  render();
  toast(`Set for ${formatHuman(date)}`);
}

function rollover() {
  flushEditor();
  const date = todayISO();
  const daily = ensureDaily();
  if (!daily) {
    toast("Open a folder first");
    return;
  }
  let note = state.notes.find(n => n.type === "daily" && n.date === date);
  const previous = state.notes
    .filter(n => n.type === "daily" && n.date && n.date < date)
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 1);
  const openTasks = [];
  const closeOnly = [];
  const seen = new Set();
  const consider = (title, fromId, fromDate, scheduledFor, indent, parentId, line) => {
    const name = String(title || "").trim();
    if (!name) return;
    if (scheduledFor && scheduledFor > date) return;
    const item = { title: name, fromId, fromDate, indent: indent || "", parentId: parentId || null, line: line == null ? null : line };
    if (seen.has(fromId)) {
      const existing = openTasks.find(entry => entry.fromId === fromId);
      if (existing && existing.line == null && line != null) existing.line = line;
      return;
    }
    seen.add(fromId);
    openTasks.push(item);
  };
  previous.forEach(prev => {
    const lines = prev.body.split("\n");
    state.tasks.filter(task => task.dailyNoteId === prev.id && !task.done).forEach(task => {
      consider(task.title, task.id, prev.date, task.scheduledFor, lineIndent(prev, task.title), task.parentId);
    });
    const claimed = new Set();
    parseChecks(prev.body).forEach(check => {
      if (check.done) return;
      const linked = state.tasks.find(task => task.dailyNoteId === prev.id && task.line === check.line && !claimed.has(task.id))
        || state.tasks.find(task => task.dailyNoteId === prev.id && !claimed.has(task.id) && task.title.trim() === check.title.trim());
      if (linked) claimed.add(linked.id);
      const scheduled = linked
        ? linked.scheduledFor
        : (sectionOf(lines, check.line) === "tomorrow" ? addDays(prev.date, 1) : null);
      consider(check.title, linked ? linked.id : `${prev.id}:${check.line}`, prev.date, scheduled, check.indent, linked && linked.parentId, check.line);
    });
  });
  state.tasks.filter(task => !task.done && !task.parentId && !task.dailyNoteId && task.scheduledFor === date).forEach(task => {
    consider(task.title, task.id, null, null, "", task.parentId);
  });

  const copying = openTasks.filter(item => item.fromDate);
  const created = !note;
  if (!note) {
    const lines = ["## todo", ...copying.map(item => checkLine(item.indent, item.title, false)), "", "## Tomorrow"];
    note = {
      id: uid(), folderId: daily.id, type: "daily", date,
      title: formatHuman(date), body: lines.join("\n")
    };
    state.notes.push(note);
    attachNewFile(note);
  } else {
    const have = new Set(parseChecks(note.body).map(check => check.title.trim()));
    insertChecks(note, copying.filter(item => !have.has(item.title)).map(item => checkLine(item.indent, item.title, false)));
  }

  const already = new Set(state.tasks.filter(task => task.dailyNoteId === note.id).map(task => task.title));
  const rolled = new Map();
  const adopted = [];
  let added = 0;
  const depthUnder = (member, rootId) => {
    let depth = 0;
    let current = member;
    const guard = new Set();
    while (current && current.id !== rootId && current.parentId && !guard.has(current.id)) {
      guard.add(current.id);
      depth += 1;
      current = state.tasks.find(entry => entry.id === current.parentId);
    }
    return depth;
  };
  openTasks.forEach(item => {
    if (!item.fromDate) {
      const task = state.tasks.find(entry => entry.id === item.fromId);
      if (!task || task.dailyNoteId) return;
      const members = state.tasks.filter(entry => new Set(taskFamily(task.id)).has(entry.id));
      const owners = new Map();
      state.tasks.filter(entry => entry.dailyNoteId === note.id).forEach(entry => {
        if (!owners.has(entry.title)) owners.set(entry.title, entry.id);
      });
      const present = new Set(parseChecks(note.body).map(check => check.title.trim()));
      members.forEach(member => {
        member.folderId = daily.id;
        member.dailyNoteId = note.id;
        member.dailyDate = date;
        if (member.id === task.id) member.scheduledFor = null;
      });
      const rows = [];
      members.forEach(member => {
        if (member.done) return;
        const owner = owners.get(member.title);
        if (present.has(member.title) && (!owner || owner === member.id)) return;
        rows.push(checkLine("  ".repeat(depthUnder(member, task.id)), member.title, false));
        present.add(member.title);
      });
      insertChecks(note, rows);
      rolled.set(task.id, task.id);
      added++;
      return;
    }
    if (already.has(item.title)) return;
    const id = uid();
    rolled.set(item.fromId, id);
    adopted.push({ id, parentId: item.parentId });
    state.tasks.push({
      id, folderId: daily.id, title: item.title, done: false, status: "todo",
      parentId: null, dailyNoteId: note.id, dailyDate: date,
      rolledFrom: item.fromId, rolledFromDate: item.fromDate, scheduledFor: null
    });
    already.add(item.title);
    added++;
  });
  adopted.forEach(row => {
    const parent = row.parentId && rolled.get(row.parentId);
    const task = state.tasks.find(entry => entry.id === row.id);
    if (task && parent) task.parentId = parent;
  });
  const touched = new Set();
  openTasks.concat(closeOnly).forEach(item => {
    if (!item.fromDate) return;
    const prev = previous.find(entry => entry.date === item.fromDate);
    if (!prev) return;
    const task = state.tasks.find(entry => entry.id === item.fromId);
    if (task && task.dailyNoteId === prev.id && !task.done && !(task.scheduledFor && task.scheduledFor > date)) {
      task.done = true;
      task.status = "done";
    }
    if (markOpenCheck(prev, item.title, item.line)) touched.add(prev);
  });
  relinkNoteTasks(note);

  state.selectedFolderId = daily.id;
  state.selectedNoteId = note.id;
  state.view = "notes";
  editingNote = false;
  state.collapsed[daily.id] = false;
  syncEditor(note);
  touched.forEach(syncEditor);
  render();
  const count = created ? openTasks.length : added;
  toast(created
    ? `Opened today with ${count} open ${count === 1 ? "task" : "tasks"}`
    : (added ? `Added ${added} open ${added === 1 ? "task" : "tasks"} to today` : "Today is open"));
}

function goNote(dir) {
  const next = neighbor(dir);
  if (!next) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sheet = document.querySelector(".sheet");
  const token = ++turnToken;
  const apply = () => {
    if (token !== turnToken) return;
    turnToken += 1;
    state.selectedNoteId = next.id;
    state.view = "notes";
    editingNote = false;
    render();
  };
  if (!sheet || reduce || typeof sheet.animate !== "function") { apply(); return; }
  const anim = sheet.animate(
    [{ transform: "translateX(0)", opacity: 1 }, { transform: `translateX(${dir > 0 ? -22 : 22}px)`, opacity: 0.45 }],
    { duration: 120, easing: "ease-in" }
  );
  anim.onfinish = apply;
  anim.oncancel = apply;
}

function openSlip(anchor) {
  if (document.body.classList.contains("gesturing")) return;
  const slip = $("slip");
  let title = "";
  let where = "";
  let text = "";
  if (anchor.dataset.note) {
    const note = state.notes.find(n => n.id === anchor.dataset.note);
    if (!note) return;
    title = note.title;
    where = notePlace(note);
    text = excerpt(note) || "Empty note";
  } else if (anchor.dataset.target) {
    const note = findNote(anchor.dataset.target);
    title = note ? note.title : anchor.dataset.target;
    where = note ? notePlace(note) : "Not written yet";
    text = note ? (excerpt(note) || "Empty note") : "Open this link to create the note.";
  } else return;
  $("slipTitle").textContent = title;
  $("slipWhere").textContent = where;
  $("slipText").textContent = text;
  slip.hidden = false;
  const rect = anchor.getBoundingClientRect();
  const width = slip.offsetWidth;
  const height = slip.offsetHeight;
  let left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
  let top = rect.bottom + 8;
  if (top + height > window.innerHeight - 12) top = Math.max(12, rect.top - height - 8);
  slip.style.left = `${left}px`;
  slip.style.top = `${top}px`;
}

  clearTimeout(slipTimer);

}

function buildPalette(query) {

  const notes = state.notes.map(note => ({
    label: note.title,
    hint: notePlace(note),
    run: () => openNote(note.id)
  }));
  return [...paletteActions(), ...notes].filter(item => !q || `${item.label} ${item.hint}`.toLowerCase().includes(q));
}

function springBack(g) {
  const row = g.el && g.el.querySelector ? g.el.querySelector(".row") : null;
  if (row) {
    row.style.transition = "transform .18s ease";
    row.style.transform = "";
    row.classList.remove("dragging");
  }
  const sheet = document.querySelector(".sheet");
  if (sheet) {
    sheet.style.transition = "transform .18s ease";
    sheet.style.transform = "";
  }
}
function finishGesture(g) {
  if (g.type === "page") {
    const dir = Number(g.el.dataset.turn);
    const passed = dir > 0 ? g.dx < -28 : g.dx > 28;
    springBack(g);
    if (passed) goNote(dir);
    return;
  }
  if (g.dx <= -72) {
    const task = resolveSwipeTask(g.el);
    if (task) toggleDone(task, !task.done, true);
    else springBack(g);
    return;
  }
  if (g.dx >= 72) {
    const task = resolveSwipeTask(g.el);
    if (!task) { springBack(g); return; }
    const due = peekDate();
    const later = task.scheduledFor && task.scheduledFor >= due;
    scheduleTask(task, later ? null : due);
    return;
  }
  springBack(g);
}

    if (!dir) {

function lineSpan(value, index) {
  const start = value.lastIndexOf("\n", Math.max(0, index - 1)) + 1;
  const breakAt = value.indexOf("\n", index);
  const end = breakAt === -1 ? value.length : breakAt;
  return { start, end };
}
function editChecklist(e) {
  const el = e.target;
  if (!el || el.id !== "noteBody") return false;
  if (e.altKey || e.metaKey || e.ctrlKey) return false;
  const value = el.value;
  const from = el.selectionStart;
  const to = el.selectionEnd;
  if (e.key === "Tab") {
    e.preventDefault();
    const head = lineSpan(value, from).start;
    const tail = lineSpan(value, Math.max(from, to - (from === to ? 0 : 1))).end;
    const lines = value.slice(head, tail).split("\n");
    const next = lines.map(line => e.shiftKey ? line.replace(/^(?: {1,2}|\t)/, "") : `  ${line}`).join("\n");
    el.value = value.slice(0, head) + next + value.slice(tail);
    if (from === to) {
      const line = value.slice(head, lineSpan(value, from).end);
      const cut = e.shiftKey ? ((line.match(/^(?: {1,2}|\t)/) || [""])[0].length) : 2;
      el.selectionStart = el.selectionEnd = Math.max(head, from + (e.shiftKey ? -cut : cut));
    } else {
      el.selectionStart = head;
      el.selectionEnd = head + next.length;
    }
    return true;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    const { start, end } = lineSpan(value, from);
    const line = value.slice(start, end);
    const check = line.match(/^(\s*)- \[([ xX])\] ?(.*)$/);
    if (check && !check[3].trim() && from === to) {
      el.value = value.slice(0, start) + value.slice(end);
      el.selectionStart = el.selectionEnd = start;
      return true;
    }
    const indent = (line.match(/^(\s*)/) || ["", ""])[1];
    const marker = `${indent}- [ ] `;
    const prefix = line.match(/^(\s*- \[[ xX]\] ?)/);
    if (prefix && from === to && from - start <= prefix[1].length) {
      el.value = `${value.slice(0, start)}${marker}\n${line}${value.slice(end)}`;
      el.selectionStart = el.selectionEnd = start + marker.length;
      return true;
    }
    if (!line.trim() && from === to) {
      el.value = value.slice(0, start) + marker + value.slice(end);
      el.selectionStart = el.selectionEnd = start + marker.length;
      return true;
    }
    const before = line.slice(0, from - start);
    const after = line.slice(to - start);
    el.value = `${value.slice(0, start)}${before}\n${marker}${after}${value.slice(end)}`;
    const caret = start + before.length + 1 + marker.length;
    el.selectionStart = el.selectionEnd = caret;
    return true;
  }

    const { start, end } = lineSpan(value, from);
    const line = value.slice(start, end);
    const check = line.match(/^(\s*)- \[([ xX])\] ?(.*)$/);
    const prefix = line.match(/^(\s*- \[[ xX]\] ?)/);
    if (!check || !prefix || from > start + prefix[1].length) return false;
    e.preventDefault();
    if (check[1]) {
      const cut = Math.min(2, check[1].length);
      el.value = value.slice(0, start) + line.slice(cut) + value.slice(end);
      el.selectionStart = el.selectionEnd = Math.max(start, from - cut);
    } else {
      el.value = value.slice(0, start) + line.slice(prefix[1].length) + value.slice(end);
      el.selectionStart = el.selectionEnd = start;
    }
    return true;
  }
  return false;
}

      if (note) {
        const lines = note.body.split("\n");
        const index = findCheckIndex(lines, previous, task.line);
        if (index >= 0) {
          const item = checkboxAt(lines[index]);
          lines[index] = checkLine(item.indent, next, item.mark !== " ");
          note.body = lines.join("\n");
          task.line = index;
          relinkNoteTasks(note);
          syncEditor(note);
        }
      }
    }
    render();
  };
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") input.blur();
    if (ev.key === "Escape") { input.value = task.title; input.blur(); }
  });
});
$("spread").addEventListener("click", (e) => {
  const link = e.target.closest("a.wikilink");
  if (link) {
    e.preventDefault();
    hideSlip();
    const note = findNote(link.dataset.target);
    if (note) openNote(note.id);
    else createLinked(link.dataset.target);
    return;
  }
  const sub = e.target.closest("[data-sub]");
  if (sub) {
    const parent = state.tasks.find(item => item.id === sub.dataset.sub);
    if (!parent) return;
    const id = uid();
    const note = parent.dailyNoteId ? state.notes.find(item => item.id === parent.dailyNoteId) : null;
    if (note) {
      const lines = note.body.split("\n");
      const at = findCheckIndex(lines, parent.title, parent.line);
      const indent = at >= 0 ? lines[at].match(/^(\s*)/)[1] : "";
      const childIndent = indent.includes("\t") ? `${indent}\t` : `${indent}  `;
      const row = `${childIndent}- [ ] Untitled`;
      if (at >= 0) {
        lines.splice(at + 1, 0, row);
        note.body = lines.join("\n");
      } else {
        insertChecks(note, [row]);
      }
      syncEditor(note);
    }
    state.tasks.push({
      id, folderId: parent.folderId, title: "Untitled", done: false, status: "todo",
      parentId: parent.id, dailyNoteId: parent.dailyNoteId, dailyDate: parent.dailyDate,
      rolledFrom: null, rolledFromDate: null, scheduledFor: null
    });
    if (note) relinkNoteTasks(note);
    render();
    const created = document.querySelector(`[data-rename-display="${id}"]`);
    if (created) created.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
    return;
  }
  const delTask = e.target.closest("[data-del-task]");
  if (delTask) { removeTask(delTask.dataset.delTask); return; }
  const delNote = e.target.closest("[data-del-note]");
  if (delNote) { removeNote(delNote.dataset.delNote); return; }
  if (e.target.id === "btnEditNote") {
    const body = $("noteBody");
    if (body) {
      const note = currentNote();
      if (note) note.body = body.value;
    }
    editingNote = !editingNote;
    render();
    return;
  }
  const jump = e.target.closest("[data-goto-task]");
  if (jump) {
    const task = state.tasks.find(item => item.id === jump.dataset.gotoTask);
    if (task) showTask(task);
    return;
  }
  if (e.target.closest("button, input, a, textarea")) return;
});

$("spread").addEventListener("dragstart", (e) => {
  const card = e.target.closest("[data-card]");
  if (!card) return;
  card.classList.add("drag");
  e.dataTransfer.setData("text/plain", card.dataset.card);
});
$("spread").addEventListener("dragend", (e) => {
  const card = e.target.closest("[data-card]");
  if (card) card.classList.remove("drag");
});
$("spread").addEventListener("dragover", (e) => {
  if (e.target.closest("[data-col]")) e.preventDefault();
});
$("spread").addEventListener("drop", (e) => {
  const col = e.target.closest("[data-col]");
  if (!col) return;
  e.preventDefault();
  const task = state.tasks.find(item => item.id === e.dataTransfer.getData("text/plain"));
  if (!task) return;
  task.status = col.dataset.col;
  task.done = col.dataset.col === "done";
  const note = task.dailyNoteId ? state.notes.find(n => n.id === task.dailyNoteId) : null;
  if (note) {
    const lines = note.body.split("\n");
    const index = findCheckIndex(lines, task.title, task.line);
    if (index >= 0) {
      const item = checkboxAt(lines[index]);
      lines[index] = checkLine(item.indent, item.title, task.done);
      note.body = lines.join("\n");
      relinkNoteTasks(note);
      syncEditor(note);
    }
  }
  render();
});

$("spread").addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  const edge = e.target.closest("[data-turn]");
  const swipe = e.target.closest(".swipe");
  if (!edge && !swipe) return;
  if (swipe && e.target.closest("input, button, a, textarea")) return;
  gesture = {
    type: edge ? "page" : "task",
    el: edge || swipe,
    pointerId: e.pointerId,
    x: e.clientX,
    y: e.clientY,
    dx: 0,
    dy: 0,
    active: false
  };
});
$("spread").addEventListener("pointermove", (e) => {
  if (!gesture || e.pointerId !== gesture.pointerId) return;
  gesture.dx = e.clientX - gesture.x;
  gesture.dy = e.clientY - gesture.y;
  if (!gesture.active) {
    if (Math.abs(gesture.dx) < 8 && Math.abs(gesture.dy) < 8) return;
    if (Math.abs(gesture.dy) > Math.abs(gesture.dx)) { gesture = null; return; }
    gesture.active = true;
    document.body.classList.add("gesturing");
    hideSlip();
    try { $("spread").setPointerCapture(e.pointerId); } catch (err) { /* already gone */ }
  }
  e.preventDefault();
  if (gesture.type === "task") {
    const row = gesture.el.querySelector(".row");
    if (!row) return;
    row.classList.add("dragging");
    row.style.transform = `translateX(${Math.max(-120, Math.min(120, gesture.dx))}px)`;
  } else {
    const sheet = document.querySelector(".sheet");
    if (!sheet) return;
    sheet.style.transition = "none";
    sheet.style.transform = `translateX(${Math.max(-36, Math.min(36, gesture.dx))}px)`;
  }
});
function endPointer(e) {
  if (!gesture || (e.pointerId != null && e.pointerId !== gesture.pointerId)) return;
  const g = gesture;
  gesture = null;
  document.body.classList.remove("gesturing");
  if (!g.active) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 350);
  finishGesture(g);
}
$("spread").addEventListener("pointerup", endPointer);
$("spread").addEventListener("pointercancel", (e) => {
  if (!gesture || e.pointerId !== gesture.pointerId) return;
  const g = gesture;
  gesture = null;
  document.body.classList.remove("gesturing");
  springBack(g);
});
document.addEventListener("click", (e) => {
  if (!suppressClick) return;
  suppressClick = false;
  e.preventDefault();
  e.stopPropagation();
}, true);

let wheelLock = 0;
$("spread").addEventListener("wheel", (e) => {
  if (state.view !== "notes") return;
  if (Math.abs(e.deltaX) < 48 || Math.abs(e.deltaX) < Math.abs(e.deltaY) * 1.4) return;
  const now = Date.now();
  if (now < wheelLock) return;
  wheelLock = now + 450;
  goNote(e.deltaX > 0 ? 1 : -1);
}, { passive: true });

document.addEventListener("mouseover", (e) => {
  const anchor = e.target.closest(".wikilink, .leaf");
  clearTimeout(slipTimer);
  if (!anchor) return;
  slipTimer = setTimeout(() => openSlip(anchor), 180);
});
document.addEventListener("mouseout", (e) => {
  const anchor = e.target.closest(".wikilink, .leaf");
  if (!anchor || anchor.contains(e.relatedTarget)) return;
  hideSlip();
});
document.addEventListener("focusin", (e) => {
  const link = e.target.closest(".wikilink");
  if (link) openSlip(link);
});
document.addEventListener("focusout", (e) => {
  if (e.target.closest(".wikilink")) hideSlip();
});
document.addEventListener("scroll", hideSlip, true);

$("modalCancel").addEventListener("click", closeModal);
$("modalBg").addEventListener("click", (e) => { if (e.target.id === "modalBg") closeModal(); });
$("modal").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("modalInput").value.trim();
  if (!name || modalMode !== "folder") return;
  if (!rootHandle) {
    toast("Open a folder first");
    return;
  }
  const id = uid();
  const parent = state.selectedFolderId || null;
  const parentHandle = parent ? dirHandles.get(parent) : rootHandle;
  if (!parentHandle) {
    toast("Could not create the folder");
    return;
  }
  try {
    const handle = await parentHandle.getDirectoryHandle(name, { create: true });
    dirHandles.set(id, handle);
  } catch (err) {
    toast("Could not create the folder");
    return;
  }
  if (parent) state.collapsed[parent] = false;
  state.folders.push({ id, name, parentId: parent });
  state.selectedFolderId = id;
  closeModal();
  render();
});
$("paletteBg").addEventListener("click", (e) => { if (e.target.id === "paletteBg") closePalette(); });
$("paletteInput").addEventListener("input", () => { paletteIndex = 0; renderPalette(); });
$("paletteList").addEventListener("click", (e) => {
  const item = e.target.closest("[data-pal]");
  if (item) runPalette(Number(item.dataset.pal));
});

document.addEventListener("keydown", (e) => {
  const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if ($("paletteBg").classList.contains("on")) closePalette();
    else openPalette();
    return;
  }
  if ($("paletteBg").classList.contains("on")) {
    if (e.key === "Escape") { e.preventDefault(); closePalette(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); paletteIndex = Math.min(paletteItems.length - 1, paletteIndex + 1); renderPalette(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); paletteIndex = Math.max(0, paletteIndex - 1); renderPalette(); return; }
    if (e.key === "Enter") { e.preventDefault(); runPalette(paletteIndex); }
    return;
  }
  if (e.key === "Escape") {
    if ($("modalBg").classList.contains("on")) { closeModal(); return; }
    if (state.query || $("search").value) {
      $("search").value = "";
      state.query = "";
      renderTree();
      save();
      return;
    }
    hideSlip();
    if (state.peekOpen) { state.peekOpen = false; render(); }
    return;
  }
  if (overlayOpen() || typing) return;
  if ((e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    rollover();
    return;
  }
  if (e.key === "[") { e.preventDefault(); goNote(-1); }
  if (e.key === "]") { e.preventDefault(); goNote(1); }
});

function applyRoute() {
  const hash = (location.hash || "").replace(/^#/, "");
  if (hash === "tasks" || hash === "board" || hash === "notes") state.view = hash;
  if (hash === "daily") {
    const daily = ensureDaily();
    if (daily) state.selectedFolderId = daily.id;
    const today = state.notes.find(n => n.type === "daily" && n.date === todayISO());
    if (today) state.selectedNoteId = today.id;
  }
}

$("search").value = state.query || "";
$("jumpKbd").textContent = `${metaKey}K`;
$("paletteFoot").textContent = "N opens today. [ and ] turn the page.";
localStorage.removeItem(KEY);

applyRoute();
render();
storedHandle().then(async (handle) => {
  if (handle && !state.notes.length) {
    try {
      const perm = await handle.queryPermission({ mode: "readwrite" });
      if (perm === "granted") await openRoot(handle);
    } catch (err) { /* the Open folder button asks again */ }
  }
  if ((location.hash || "").replace(/^#/, "") === "rollover") rollover();
});
window.addEventListener("hashchange", () => {
  if ((location.hash || "").replace(/^#/, "") === "rollover") rollover();
  else { applyRoute(); render(); }
});
</script>
</body>
</html>
