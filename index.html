<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Folia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --desk: #d7e1ea;
      --page: #f6f8fa;
      --under: #e4f0e6;
      --ink: #17202b;
      --mute: #526272;
      --faint: #5c6c7b;
      --line: #c5d1db;
      --leaf: #0f5c45;
      --leaf-soft: #dceee4;
      --hover: #e8eef3;
      --under-done: #17202b;
      --under-next: #0f5c45;
      --shadow: 0 16px 40px rgba(23, 32, 43, 0.12);
      --sans: "Familjen Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      --serif: Newsreader, "Iowan Old Style", Palatino, Georgia, serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --desk: #0b1015;
        --page: #24303a;
        --under: #173028;
        --ink: #e7eef4;
        --mute: #a9b7c3;
        --faint: #8494a3;
        --line: #31404d;
        --leaf: #8ed4b8;
        --leaf-soft: #1a3328;
        --hover: #24303a;
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--sans);
      background: var(--desk);
      color: var(--ink);
      display: flex;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.45;
      overscroll-behavior: none;
    }
    button, input, textarea { font-family: inherit; color: inherit; }
    button { cursor: pointer; }
    ::selection { background: var(--leaf-soft); }
    :focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
    body.gesturing, body.gesturing * { user-select: none !important; cursor: grabbing; }

    .rail {
      width: 248px;
      min-width: 248px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .brand {
      padding: 22px 18px 8px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .mark {
      width: 28px; height: 28px;
      color: var(--leaf);
      display: grid; place-items: center;
    }
    .brand h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 26px;
      margin: 0;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .brand small {
      display: block;
      margin-top: 3px;
      color: var(--mute);
      font-size: 13px;
    }
    .today-btn, .text-btn, .ghost {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font-weight: 600;
      font-size: 14px;
    }
    .today-btn {
      margin: 14px 16px 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      text-align: left;
    }
    .today-btn:hover, .text-btn:hover, .ghost:hover { border-color: var(--leaf); color: var(--leaf); }
    .today-btn kbd, kbd {
      font-family: inherit;
      font-weight: 500;
      color: var(--faint);
      font-size: 12px;
    }
    .search {
      margin: 0 16px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--mute);
      border-bottom: 1px solid var(--line);
      padding: 4px 2px 6px;
    }
    .search input {
      border: 0; background: transparent; outline: none; width: 100%;
      font-size: 14px; padding: 0;
    }
    .search input:focus-visible { outline: none; }
    .search:focus-within { border-bottom-color: var(--leaf); }
    .tree-label {
      padding: 4px 16px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--mute);
      font-size: 14px;
    }
    .icon-btn {
      width: 26px; height: 26px;
      border: 0; background: transparent; color: var(--mute);
      border-radius: 6px;
      display: grid; place-items: center; padding: 0;
      font-size: 16px;
    }
    .icon-btn:hover { background: var(--hover); color: var(--ink); }
    .tree {
      flex: 1;
      overflow: auto;
      padding: 0 8px 16px;
      min-height: 0;
    }
    .node, .leaf {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      color: var(--ink);
      user-select: none;
    }
    .node { cursor: pointer; }
    .leaf { cursor: grab; }
    .node:hover, .leaf:hover { background: var(--hover); }
    .node.active, .leaf.active { background: var(--leaf-soft); }
    .node.drop { background: var(--leaf-soft); outline: 1px solid var(--leaf); }
    .chev {
      width: 16px; height: 16px;
      border: 0; background: transparent; color: var(--faint);
      display: grid; place-items: center; padding: 0; flex: none;
    }
    .chev svg { transition: transform 0.15s ease; }
    .chev.open svg { transform: rotate(90deg); }
    .chev.empty { visibility: hidden; }
    .fname {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .count { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 13px; }
    .leaf-mark {
      width: 8px; height: 1px; background: var(--faint); flex: none; margin-left: 4px;
    }
    .leaf.active .leaf-mark { background: var(--leaf); }
    .side-foot {
      padding: 12px 16px 16px;
      color: var(--mute);
      font-size: 13px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      justify-content: space-between;
    }
    .hint { color: var(--mute); margin-top: 4px; line-height: 1.35; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 22px 12px;
      min-height: 58px;
    }
    .path { color: var(--mute); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .path b { color: var(--ink); font-weight: 600; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .text-btn { padding: 6px 10px; }
    .views { display: flex; gap: 4px; }
    .view {
      background: none; border: 0;
      color: var(--mute);
      font-weight: 600;
      font-size: 14px;
      padding: 6px 8px;
      border-radius: 6px;
    }
    .view.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--leaf); }
    .spread {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      padding: 0 18px 18px 10px;
      gap: 0;
    }
    .book {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      z-index: 1;
    }
    .sheet {
      position: relative;
      flex: 1;
      min-width: 0;
      background: var(--page);
      border-radius: 2px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .edge {
      position: absolute;
      top: 0; bottom: 0;
      width: 36px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: ew-resize;
      color: var(--faint);
    }
    .edge span {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 12px;
      max-height: 46%;
      overflow: hidden;
      pointer-events: none;
    }
    .edge-prev { left: 0; }
    .edge-next { right: 0; }
    .sheet-inner { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
    .prose { max-width: 68ch; padding: 8px 40px 48px; }
    .sheet-head {
      position: sticky; top: 0; z-index: 2;
      background: var(--page);
      padding-top: 8px;
    }
    .ed-bar { display: flex; align-items: center; gap: 8px; min-height: 32px; }
    .spacer { flex: 1; }
    .ed-title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(26px, 4vw, 34px);
      line-height: 1.15;
      letter-spacing: -0.03em;
      width: 100%;
      border: 0;
      background: transparent;
      padding: 4px 0 8px;
      outline: none;
      display: block;
      resize: none;
      overflow: hidden;
      field-sizing: content;
      min-height: 1.2em;
    }
    .ed-title:focus-visible { outline: none; box-shadow: inset 0 -1px 0 var(--leaf); }
    .ed-body {
      width: 100%;
      min-height: 50vh;
      border: 0;
      resize: none;
      background: transparent;
      outline: none;
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.55;
      padding: 0;
      tab-size: 2;
    }
    .ed-bar .hint { margin: 0; }
    .preview { font-family: var(--serif); font-size: 18px; line-height: 1.55; }
    .preview h1, .preview h2, .preview h3 { font-weight: 500; letter-spacing: -0.02em; line-height: 1.25; }
    .preview h1 { font-size: 28px; margin: 0.6em 0 0.3em; }
    .preview h2 { font-size: 22px; margin: 1em 0 0.3em; }
    .preview .section-label {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      margin: 1.5em 0 0.45em;
    }
    .preview .todo {
      --nest: 0;
      margin: 0 0 2px calc(var(--nest) * 22px);
      border-radius: 10px;
    }
    .preview .todo .row {
      min-height: 42px;
      padding: 8px 12px;
      gap: 12px;
      border-radius: 10px;
      background: var(--page);
    }
    .preview .todo:hover .row { background: var(--hover); }
    .preview .todo .line {
      font-size: 17px;
      line-height: 1.35;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 10px;
    }
    a.ext {
      color: var(--leaf);
      text-underline-offset: 3px;
    }
    .task-links { display: inline-flex; flex-wrap: wrap; gap: 6px; }
    .task-links a.ext {
      font-family: var(--sans);
      font-size: 12px;
      text-decoration: none;
      background: var(--leaf-soft);
      color: var(--leaf);
      border-radius: 999px;
      padding: 1px 8px;
    }
    .preview .todo.nested .row { box-shadow: inset 2px 0 0 var(--line); }
    .preview .check { width: 18px; height: 18px; border-radius: 50%; }
    .preview h3 { font-size: 18px; margin: 0.8em 0 0.25em; }
    .preview p { margin: 0.35em 0; }
    .preview .bullet { padding-left: 1em; text-indent: -0.8em; }
    .preview code {
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 0.86em;
      background: var(--desk);
      padding: 0 0.25em;
      border-radius: 3px;
    }
    .wikilink { color: var(--leaf); text-underline-offset: 3px; }
    .wikilink.missing { color: var(--mute); text-decoration-style: dotted; }
    .mentions { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line); }
    .mentions h2 { font-size: 18px; font-weight: 500; margin: 0 0 8px; }
    .mentions a { display: block; margin: 4px 0; }

    .pane { max-width: 40rem; padding: 8px 36px 48px; }
    .add-row { display: flex; gap: 8px; margin: 8px 0 14px; }
    .add-row input, .peek-add input, .modal input, .pal-input {
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 8px 2px;
      outline: none;
      font-size: 15px;
    }
    .add-row input { flex: 1; }
    .add-row input:focus, .peek-add input:focus, .modal input:focus, .pal-input:focus { border-bottom-color: var(--leaf); }
    .group-label {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 500;
      margin: 8px 0 6px;
    }
    .swipe { position: relative; overflow: hidden; border-radius: 6px; touch-action: pan-y; }
    .under {
      position: absolute; inset: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 14px;
      color: #f6f8fa;
      font-weight: 600;
      background: linear-gradient(90deg, var(--under-next) 0 50%, var(--under-done) 50% 100%);
    }
    .row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      background: var(--page);
      min-height: 36px;
    }
    .swipe:hover .row { background: var(--hover); }
    .row.dragging { transition: none; }
    .t-title, .line { min-width: 0; }
    .t-title { flex: 0 1 auto; }
    .line { flex: 1; }
    .task-tools { margin-left: auto; }
    .t-title.done, .line.done { color: var(--faint); text-decoration: line-through; }
    .when { color: var(--leaf); font-size: 13px; flex: none; }
    .task-tools { display: flex; gap: 2px; opacity: 0; }
    .swipe:hover .task-tools, .swipe:focus-within .task-tools { opacity: 1; }
    .check {
      appearance: none;
      width: 16px; height: 16px;
      border: 1.5px solid var(--mute);
      border-radius: 4px;
      background: transparent;
      flex: none;
      display: grid; place-items: center;
      margin: 0;
    }
    .check:checked { background: var(--leaf); border-color: var(--leaf); }
    .check:checked::after {
      content: "";
      width: 8px; height: 5px;
      border-left: 2px solid var(--page);
      border-bottom: 2px solid var(--page);
      transform: rotate(-45deg) translate(0, -1px);
    }
    .empty { color: var(--mute); padding: 28px 4px; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
      padding: 12px 8px 32px;
    }
    .col-h { display: flex; align-items: baseline; gap: 8px; }
    .col-h h3 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 22px;
      margin: 0;
    }
    .col-h span { color: var(--faint); font-variant-numeric: tabular-nums; }
    .card {
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      border-radius: 0;
      padding: 10px 2px;
      cursor: grab;
      box-shadow: none;
    }
    .card h4 { margin: 0; font-size: 15px; font-weight: 600; }
    .card h4.done { color: var(--faint); text-decoration: line-through; }
    .card.drag { opacity: 0.4; }
    .subs { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    .sub { display: flex; gap: 8px; align-items: center; color: var(--mute); font-size: 13px; }

    .peek {
      width: 54px;
      margin-left: -8px;
      padding-left: 8px;
      background: var(--under);
      border-radius: 0 2px 2px 0;
      display: flex;
      flex: none;
      min-height: 0;
      overflow: hidden;
      z-index: 0;
    }
    .peek.open { width: 300px; }
    .peek-tab {
      width: 46px;
      flex: none;
      border: 0;
      background: transparent;
      color: var(--leaf);
      font-family: var(--serif);
      font-size: 17px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      padding: 16px 0;
    }
    .peek-body { flex: 1; min-width: 0; overflow: auto; padding: 18px 16px 16px 6px; }
    .peek-body h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 26px;
      margin: 0 0 4px;
    }
    .peek-date { color: var(--mute); margin-bottom: 12px; }
    .peek-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-top: 1px solid var(--line);
      padding: 8px 0;
      display: block;
    }
    .peek-item small { display: block; color: var(--mute); font-size: 12px; }
    .peek-add { margin-top: 12px; }
    .peek-add input { width: 100%; }

    .menu {
      position: fixed;
      z-index: 60;
      min-width: 196px;
      background: var(--page);
      color: var(--ink);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 4px;
    }
    .menu[hidden] { display: none; }
    .menu button {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    .menu button:hover { background: var(--hover); }
    .daily-mark {
      margin-left: auto;
      color: var(--leaf);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .node { display: flex; align-items: center; }

    .slip {
      position: fixed;
      z-index: 50;
      width: min(320px, calc(100vw - 24px));
      background: var(--page);
      color: var(--ink);
      border-radius: 2px;
      box-shadow: var(--shadow);
      padding: 12px 14px 14px;
      pointer-events: none;
    }
    .slip[hidden] { display: none; }
    .slip strong {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 500;
      display: block;
    }
    .slip-where { color: var(--mute); font-size: 13px; margin: 2px 0 6px; }
    .slip p {
      margin: 0;
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: var(--page);
      border-radius: 999px;
      padding: 8px 8px 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 60;
      font-size: 14px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast button {
      background: transparent;
      color: inherit;
      border: 1px solid currentColor;
      border-radius: 999px;
      padding: 4px 10px;
      font-weight: 600;
    }

    .modal-bg, .palette-bg {
      position: fixed; inset: 0;
      background: rgba(16, 22, 28, 0.28);
      display: none;
      z-index: 40;
    }
    .modal-bg.on { display: grid; place-items: center; }
    .palette-bg.on { display: block; }
    .modal, .palette {
      background: var(--page);
      border-radius: 2px;
      box-shadow: var(--shadow);
      width: min(440px, calc(100vw - 32px));
    }
    .modal { padding: 18px; }
    .modal h3 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0 0 10px; }
    .modal input { width: 100%; margin-bottom: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .palette { margin: 14vh auto 0; overflow: hidden; }
    .pal-input { width: 100%; padding: 14px 16px; font-size: 16px; }
    .pal-list { max-height: 46vh; overflow: auto; padding-bottom: 8px; }
    .pal-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
    }
    .pal-item.on, .pal-item:hover { background: var(--leaf-soft); }
    .pal-item small { color: var(--mute); }
    .pal-foot { color: var(--faint); font-size: 13px; padding: 8px 16px 12px; }

    /* Vault theme: flat panes, one sans face, quiet accent, compact task lists. */
    :root {
      --desk: #f6f6f6;
      --page: #ffffff;
      --under: #f6f6f6;
      --ink: #222222;
      --mute: #5c5c5c;
      --faint: #7a7a7a;
      --line: #e3e3e3;
      --leaf: #6a55cc;
      --leaf-soft: rgba(106, 85, 204, 0.12);
      --hover: #ececec;
      --under-done: #4a4a4a;
      --under-next: #6a55cc;
      --code: #f2f2f2;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
      --sans: Inter, ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      --serif: var(--sans);
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --desk: #262626;
        --page: #1e1e1e;
        --under: #262626;
        --ink: #dadada;
        --mute: #b3b3b3;
        --faint: #8f8f8f;
        --line: #363636;
        --leaf: #a88bfa;
        --leaf-soft: rgba(138, 92, 245, 0.2);
        --hover: #303030;
        --under-done: #3f3f3f;
        --under-next: #7f6df2;
        --code: #2a2a2a;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
        --desk: #262626;
        --page: #1e1e1e;
        --under: #262626;
        --ink: #dadada;
        --mute: #b3b3b3;
        --faint: #8f8f8f;
        --line: #363636;
        --leaf: #a88bfa;
        --leaf-soft: rgba(138, 92, 245, 0.2);
        --hover: #303030;
        --under-done: #3f3f3f;
        --under-next: #7f6df2;
        --code: #2a2a2a;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);

    const parent = stack[stack.length - 1];
    const task = t(
      uid(), note.folderId, check.title.trim(), check.done,

function taskTree(list) {

    const key = task.parentId || "_";

  });
  const walk = (pid, depth) => (byParent.get(pid) || []).flatMap(task => [{ task, depth }, ...walk(task.id, depth + 1)]);

  return roots.flatMap(task => [{ task, depth: 0 }, ...walk(task.id, 1)]);

// Open tasks that carry from a daily note to the next day. Each item keeps
// its place under the nearest open parent; a done parent is not carried, so
// its open children move up a level. The source note is never changed.
function carriedFrom(prev, date) {
  const lines = prev.body.split("\n");
  const out = [];
  let stack = [];
  lines.forEach((line, i) => {
    if (/^#{1,6}\s/.test(line)) { stack = []; return; }
    const item = checkboxAt(line);
    if (!item) return;
    while (stack.length && stack[stack.length - 1].depth >= item.depth) stack.pop();
    const open = stack.filter(entry => entry.open);
    const linked = state.tasks.find(task => task.dailyNoteId === prev.id && task.line === i);
    const later = linked && linked.scheduledFor && linked.scheduledFor > date;
    const carry = item.mark === " " && !later;
    stack.push({ depth: item.depth, open: carry, title: item.title });
    if (!carry) return;
    out.push({ title: item.title, depth: open.length, parent: open.length ? open[open.length - 1].title : null });
  });
  return out;
}
function todoSectionEnd(lines) {
  let at = lines.findIndex(line => /^##\s+(today|todo)\b/i.test(line.trim()));
  if (at < 0) {
    lines.unshift("## todo", "");
    at = 0;
  }
  let end = at + 1;
  while (end < lines.length && !/^#{1,6}\s/.test(lines[end])) end += 1;
  while (end > at + 1 && !lines[end - 1].trim()) end -= 1;
  return end;
}
function mergeCarried(note, items) {
  const lines = note.body.split("\n");
  const present = new Set(parseChecks(note.body).map(check => check.title.trim()));
  let added = 0;
  items.forEach(item => {
    if (present.has(item.title)) return;
    let at = -1;
    let indent = "  ".repeat(item.depth);
    if (item.parent) {
      const parentAt = findCheckIndex(lines, item.parent);
      if (parentAt >= 0) {
        at = blockEnd(lines, parentAt);
        while (at > parentAt + 1 && !lines[at - 1].trim()) at -= 1;
        indent = `${checkboxAt(lines[parentAt]).indent}  `;
      }
    }
    if (at < 0) {
      at = todoSectionEnd(lines);
      if (!item.parent) indent = "";
    }
    lines.splice(at, 0, checkLine(indent, item.title, false));
    present.add(item.title);
    added += 1;
  });

  return added;
}

function rollover(quiet) {
  flushEditor();

  const daily = ensureDaily();
  if (!daily) {
    if (!quiet) toast(state.folders.length ? "Right-click a folder and mark it as the daily folder" : "Open a folder first");
    return;
  }
  const prev = state.notes
    .filter(n => n.type === "daily" && n.folderId === daily.id && n.date && n.date < date && parseChecks(n.body).length)
    .sort((a, b) => b.date.localeCompare(a.date))[0] || null;
  const items = prev ? carriedFrom(prev, date) : [];
  let note = state.notes.find(n => n.type === "daily" && n.date === date && n.folderId === daily.id)
    || state.notes.find(n => n.type === "daily" && n.date === date);
  const created = !note;
  if (!note) {
    note = {
      id: uid(), folderId: daily.id, type: "daily", date,
      title: formatHuman(date), body: "## todo\n\n## Tomorrow\n",
      fileName: `${date}.md`
    };
    state.notes.push(note);
  }
  let added = mergeCarried(note, items);

  // Tasks scheduled for today before today's note existed.
  state.tasks.filter(task => !task.done && !task.parentId && !task.dailyNoteId && task.scheduledFor === date).forEach(task => {
    const family = taskFamily(task.id).map(id => state.tasks.find(entry => entry.id === id)).filter(Boolean);
    const depthOf = (member) => {
      let depth = 0;
      let current = member;
      while (current && current.id !== task.id && current.parentId) {
        depth += 1;
        current = state.tasks.find(entry => entry.id === current.parentId);
      }
      return depth;
    };
    const parentTitle = (member) => {
      const parent = member.id === task.id ? null : state.tasks.find(entry => entry.id === member.parentId);
      return parent ? parent.title : null;
    };
    added += mergeCarried(note, family.filter(member => !member.done).map(member => ({
      title: member.title, depth: depthOf(member), parent: parentTitle(member)
    })));
    state.tasks = state.tasks.filter(entry => !family.includes(entry));

  if (created) attachNewFile(note);
  try { localStorage.setItem(rolledKey(date), "1"); } catch (err) { /* rolls again next time */ }

  if (quiet && !created && !added) return;
  state.selectedFolderId = daily.id;
  state.selectedNoteId = note.id;
  state.view = "notes";
  editingNote = liveDefault;
  state.collapsed[daily.id] = false;
  pathOf(daily.id).forEach(folder => { state.collapsed[folder.id] = false; });
  document.body.classList.remove("rail-open");
  syncEditor(note);
  render();
  toast(created
    ? (added ? `Opened today with ${added} open ${added === 1 ? "task" : "tasks"}` : "Opened today")
    : (added ? `Added ${added} open ${added === 1 ? "task" : "tasks"} to today` : "Today is open"));
}

  let done = false;

  const today = state.notes.find(n => n.type === "daily" && n.date === date);
  if (done && today) return;
  rollover(true);
}

function vaultTasks() {
  const daily = state.notes.filter(n => n.type === "daily" && n.date).sort((a, b) => b.date.localeCompare(a.date));
  const other = state.notes.filter(n => !(n.type === "daily" && n.date)).sort((a, b) => a.title.localeCompare(b.title));
  const seen = new Set();
  const groups = daily.map(note => ({
    note,
    rows: parseChecks(note.body).filter(check => {
      const key = check.title.trim();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    })
  }));

}

// Rename the file behind a note and fix [[links]] to it in other notes.
async function renameNote(note, next) {
  const name = next.replace(/[\\/:*?"<>|#^[\]]/g, "-").replace(/\s+/g, " ").trim();
  if (!name || name === note.title) { syncEditor(note); return; }
  const fileName = `${name}.md`;
  const clash = state.notes.some(n => n !== note && n.folderId === note.folderId && (n.fileName || "").toLowerCase() === fileName.toLowerCase());
  if (clash) {
    toast("A note with that name is already in this folder");
    syncEditor(note);
    return;
  }
  const dir = dirHandles.get(note.folderId);
  const old = fileHandles.get(note.id);
  if (dir && old) {
    try {
      const fresh = await dir.getFileHandle(fileName, { create: true });
      const writable = await fresh.createWritable();
      await writable.write(note.body);
      await writable.close();
      if (note.fileName && note.fileName.toLowerCase() !== fileName.toLowerCase()) await dir.removeEntry(note.fileName);
      fileHandles.set(note.id, fresh);
      written.set(note.id, note.body);
    } catch (err) {
      toast("Could not rename the file");
      syncEditor(note);
      return;
    }
  }
  const before = note.title;
  note.title = name;
  note.fileName = fileName;
  const re = new RegExp(`\\[\\[\\s*${before.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\s*((?:#[^\\]|]*)?(?:\\|[^\\]]*)?)\\]\\]`, "gi");
  let changed = 0;
  state.notes.forEach(other => {
    const body = other.body.replace(re, (_, rest) => `[[${name}${rest}]]`);
    if (body !== other.body) {
      other.body = body;
      changed += 1;
      syncEditor(other);
    }
  });
  render();
  toast(changed ? `Renamed. Updated links in ${changed} ${changed === 1 ? "note" : "notes"}` : "Renamed");
}

function goNote(dir) {
  const next = neighbor(dir);
  if (!next) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sheet = document.querySelector(".sheet");
  const token = ++turnToken;
  const apply = () => {
    if (token !== turnToken) return;
    turnToken += 1;
    state.selectedNoteId = next.id;
    state.view = "notes";

  if (!sheet || reduce || typeof sheet.animate !== "function") { apply(); return; }
  const anim = sheet.animate(
    [{ transform: "translateX(0)", opacity: 1 }, { transform: `translateX(${dir > 0 ? -22 : 22}px)`, opacity: 0.45 }],
    { duration: 120, easing: "ease-in" }

function openSlip(anchor) {

    const note = state.notes.find(n => n.id === anchor.dataset.note);
    if (!note) return;
    title = note.title;
    where = notePlace(note);
    text = excerpt(note) || "Empty note";
  } else if (anchor.dataset.target) {
    const note = findNote(anchor.dataset.target);
    title = note ? note.title : anchor.dataset.target;
    where = note ? notePlace(note) : "Not written yet";
    text = note ? (excerpt(note) || "Empty note") : "Open this link to create the note.";
  } else return;
  $("slipTitle").textContent = title;
  $("slipWhere").textContent = where;
  $("slipText").textContent = text;
  slip.hidden = false;
  const rect = anchor.getBoundingClientRect();
  const width = slip.offsetWidth;

$("spread").addEventListener("drop", (e) => {
  const col = e.target.closest("[data-col]");
  if (!col) return;
  e.preventDefault();
  const task = state.tasks.find(item => item.id === e.dataTransfer.getData("text/plain"));
  if (!task) return;
  task.status = col.dataset.col;
  task.done = col.dataset.col === "done";
  const note = task.dailyNoteId ? state.notes.find(n => n.id === task.dailyNoteId) : null;
  if (note) {
    const lines = note.body.split("\n");
    const index = findCheckIndex(lines, task.title, task.line);
    if (index >= 0) {
      const item = checkboxAt(lines[index]);
      lines[index] = checkLine(item.indent, item.title, task.done);
      note.body = lines.join("\n");
      relinkNoteTasks(note);
      syncEditor(note);
    }
  }
  render();
});

$("spread").addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  const edge = e.target.closest("[data-turn]");
  const swipe = e.target.closest(".swipe");
  if (!edge && !swipe) return;
  if (swipe && e.target.closest("input, button, a, textarea")) return;
  gesture = {
    type: edge ? "page" : "task",
    el: edge || swipe,
    pointerId: e.pointerId,
    x: e.clientX,
    y: e.clientY,
    dx: 0,
    dy: 0,
    active: false
  };
});
$("spread").addEventListener("pointermove", (e) => {
  if (!gesture || e.pointerId !== gesture.pointerId) return;
  gesture.dx = e.clientX - gesture.x;
  gesture.dy = e.clientY - gesture.y;
  if (!gesture.active) {
    if (Math.abs(gesture.dx) < 8 && Math.abs(gesture.dy) < 8) return;
    if (Math.abs(gesture.dy) > Math.abs(gesture.dx)) { gesture = null; return; }
    gesture.active = true;
    document.body.classList.add("gesturing");
    hideSlip();
    try { $("spread").setPointerCapture(e.pointerId); } catch (err) { /* already gone */ }
  }
  e.preventDefault();
  if (gesture.type === "task") {
    const row = gesture.el.querySelector(".row");
    if (!row) return;
    row.classList.add("dragging");
    row.style.transform = `translateX(${Math.max(-120, Math.min(120, gesture.dx))}px)`;
  } else {
    const sheet = document.querySelector(".sheet");
    if (!sheet) return;
    sheet.style.transition = "none";
    sheet.style.transform = `translateX(${Math.max(-36, Math.min(36, gesture.dx))}px)`;
  }
});
function endPointer(e) {
  if (!gesture || (e.pointerId != null && e.pointerId !== gesture.pointerId)) return;
  const g = gesture;
  gesture = null;
  document.body.classList.remove("gesturing");
  if (!g.active) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 350);
  finishGesture(g);
}
$("spread").addEventListener("pointerup", endPointer);
$("spread").addEventListener("pointercancel", (e) => {
  if (!gesture || e.pointerId !== gesture.pointerId) return;
  const g = gesture;
  gesture = null;
  document.body.classList.remove("gesturing");
  springBack(g);
});
document.addEventListener("click", (e) => {
  if (!suppressClick) return;
  suppressClick = false;
  e.preventDefault();
  e.stopPropagation();
}, true);

let wheelLock = 0;
$("spread").addEventListener("wheel", (e) => {
  if (state.view !== "notes") return;
  if (Math.abs(e.deltaX) < 48 || Math.abs(e.deltaX) < Math.abs(e.deltaY) * 1.4) return;
  const now = Date.now();
  if (now < wheelLock) return;
  wheelLock = now + 450;
  goNote(e.deltaX > 0 ? 1 : -1);
}, { passive: true });

document.addEventListener("mouseover", (e) => {
  const anchor = e.target.closest(".wikilink, .leaf");
  clearTimeout(slipTimer);
  if (!anchor) return;
  slipTimer = setTimeout(() => openSlip(anchor), 180);
});
document.addEventListener("mouseout", (e) => {
  const anchor = e.target.closest(".wikilink, .leaf");
  if (!anchor || anchor.contains(e.relatedTarget)) return;
  hideSlip();
});
document.addEventListener("focusin", (e) => {
  const link = e.target.closest(".wikilink");
  if (link) openSlip(link);
});
document.addEventListener("focusout", (e) => {
  if (e.target.closest(".wikilink")) hideSlip();
});
document.addEventListener("scroll", hideSlip, true);

$("modalCancel").addEventListener("click", closeModal);
$("modalBg").addEventListener("click", (e) => { if (e.target.id === "modalBg") closeModal(); });
$("modal").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("modalInput").value.trim();
  if (!name || modalMode !== "folder") return;
  if (!rootHandle) {
    toast("Open a folder first");
    return;
  }
  const id = uid();
  const parent = state.selectedFolderId || null;
  const parentHandle = parent ? dirHandles.get(parent) : rootHandle;
  if (!parentHandle) {
    toast("Could not create the folder");
    return;
  }
  try {
    const handle = await parentHandle.getDirectoryHandle(name, { create: true });
    dirHandles.set(id, handle);
  } catch (err) {
    toast("Could not create the folder");
    return;
  }
  if (parent) state.collapsed[parent] = false;
  state.folders.push({ id, name, parentId: parent });
  state.selectedFolderId = id;
  closeModal();
  render();
});
$("paletteBg").addEventListener("click", (e) => { if (e.target.id === "paletteBg") closePalette(); });
$("paletteInput").addEventListener("input", () => { paletteIndex = 0; renderPalette(); });
$("paletteList").addEventListener("click", (e) => {
  const item = e.target.closest("[data-pal]");
  if (item) runPalette(Number(item.dataset.pal));
});

document.addEventListener("keydown", (e) => {
  const active = document.activeElement;
  const typing = ["INPUT", "TEXTAREA"].includes(active.tagName) || active.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === "e") {
    e.preventDefault();
    if (currentNote()) setMode(!editingNote);
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "\\") {
    e.preventDefault();
    toggleRail();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if ($("paletteBg").classList.contains("on")) closePalette();
    else openPalette();
    return;
  }
  if ($("paletteBg").classList.contains("on")) {
    if (e.key === "Escape") { e.preventDefault(); closePalette(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); paletteIndex = Math.min(paletteItems.length - 1, paletteIndex + 1); renderPalette(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); paletteIndex = Math.max(0, paletteIndex - 1); renderPalette(); return; }
    if (e.key === "Enter") { e.preventDefault(); runPalette(paletteIndex); }
    return;
  }
  if (e.key === "Escape") {
    if ($("modalBg").classList.contains("on")) { closeModal(); return; }
    if (state.query || $("search").value) {
      $("search").value = "";
      state.query = "";
      renderTree();
      save();
      return;
    }
    hideSlip();
    if (state.peekOpen) { state.peekOpen = false; render(); }
    return;
  }
  if (overlayOpen() || typing) return;
  if ((e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    rollover();
    return;
  }
  if (e.key === "[") { e.preventDefault(); goNote(-1); }
  if (e.key === "]") { e.preventDefault(); goNote(1); }
});

function applyRoute() {
  const hash = (location.hash || "").replace(/^#/, "");
  if (hash === "notes" || hash === "tasks" || hash === "board") state.view = "notes";
  if (hash === "daily") {
    const daily = ensureDaily();
    if (daily) state.selectedFolderId = daily.id;
    const today = state.notes.find(n => n.type === "daily" && n.date === todayISO());
    if (today) state.selectedNoteId = today.id;
  }
}

$("search").value = state.query || "";
$("jumpKbd").textContent = `${metaKey}K`;
$("paletteFoot").textContent = `N opens today · [ and ] turn the page · ${metaKey}E edit or read · ${metaKey}Enter ticks a task`;
localStorage.removeItem(KEY);

applyRoute();
render();
storedHandle().then(async (handle) => {
  if (handle && !state.notes.length) {
    try {
      const perm = await handle.queryPermission({ mode: "readwrite" });
      if (perm === "granted") await openRoot(handle);
    } catch (err) { /* the Open folder button asks again */ }
  }
  if ((location.hash || "").replace(/^#/, "") === "rollover") rollover();
});
// Fonts and window width change how the title wraps.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitTitle($("noteTitle")));
window.addEventListener("resize", () => fitTitle($("noteTitle")));
// A new day starts while the app is open: carry tasks onto it.
setInterval(autoRollover, 60 * 1000);
window.addEventListener("focus", autoRollover);
document.addEventListener("visibilitychange", () => { if (!document.hidden) autoRollover(); });
window.addEventListener("hashchange", () => {
  if ((location.hash || "").replace(/^#/, "") === "rollover") rollover();
  else { applyRoute(); render(); }
});
</script>
</body>
</html>
